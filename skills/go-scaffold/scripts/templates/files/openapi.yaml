openapi: 3.0.3
info:
  title: {{PROJECT_NAME}}
  description: |
    JWT access + refresh token authentication, rate limiting, password policy,
    and input sanitization. Contract-first API — server code is generated from
    this spec with oapi-codegen.
  version: 1.0.0
servers:
  # Documentation only — oapi-codegen does NOT read this to register routes; the
  # prefix comes from middleware.BaseURL (internal/api/middleware/selector.go),
  # which is also what the route selectors match on. Keep the two identical.
  - url: http://localhost:8090/api/v1
tags:
  - name: auth
    description: Registration, login, token refresh, and logout
  - name: user
    description: Authenticated user profile operations
  - name: admin
    description: Admin user management

paths:
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /user/profile:
    get:
      operationId: getProfile
      tags: [user]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: updateProfile
      tags: [user]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Items per page (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /admin/users/{id}/role:
    put:
      operationId: updateUserRole
      tags: [admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/users/{id}:
    delete:
      operationId: deleteUser
      tags: [admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SignUpRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            binding: 'required,email'
        password:
          type: string
          minLength: 8
          x-oapi-codegen-extra-tags:
            binding: 'required,min=8'
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          x-oapi-codegen-extra-tags:
            binding: 'required,min=2,max=100,notags'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            binding: 'required,email'
        password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: 'required'

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          x-oapi-codegen-extra-tags:
            binding: 'required'

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          x-oapi-codegen-extra-tags:
            binding: 'required'

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          x-oapi-codegen-extra-tags:
            binding: 'omitempty,min=2,max=100,notags'

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [user, admin]
          x-oapi-codegen-extra-tags:
            binding: 'required,oneof=user admin'

    LoginResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    UserListResponse:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
