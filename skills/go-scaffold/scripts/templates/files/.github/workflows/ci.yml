name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Spec↔code sync: regenerate from openapi.yaml and fail if the committed
      # api/api.gen.go drifted. `gofmt -s` matches what the scaffold applied
      # post-codegen, so the diff reflects real drift only.
      - run: make generate
      - run: gofmt -s -w .
      - run: git diff --exit-code api/api.gen.go
      - run: go vet ./...
      - run: go build -o bin/server .
      - run: go test ./... -count=1
      # staticcheck on hand-written code only — api/ is oapi-codegen output.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 $(go list ./... | grep -v '/api$')
