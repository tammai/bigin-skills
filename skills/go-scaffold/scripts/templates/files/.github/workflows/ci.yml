name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Spec↔code sync: regenerate from openapi.yaml and fail if the committed
      # generated file drifted. `gofmt -s` matches what the scaffold applied
      # post-codegen, so the diff reflects real drift only.
      - run: make generate
      - run: gofmt -s -w .
      - run: git diff --exit-code internal/openapi/openapi.gen.go
      - run: go vet ./...
      - run: go build -o bin/server ./cmd/server
      # Includes internal/arch, the architecture test: an import crossing a
      # module boundary fails here, not at review time.
      - run: go test ./... -count=1
      # staticcheck on hand-written code only — internal/openapi is generated.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 $(go list ./... | grep -v '/internal/openapi$')
