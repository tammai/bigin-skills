<!-- Floating controls. Styles in assets/chrome.css, behavior in assets/site.js.

     One bottom-right column rather than a button in each corner. Back-to-top
     comes first in the DOM and renders above the theme toggle, so the toggle
     — the control that is always there — keeps the same spot whether or not
     back-to-top is showing, and tab order follows what the eye sees. -->
<div class="float-stack">
  <button id="backToTop" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
    </svg>
  </button>

  <button id="themeToggle" class="float-btn" aria-label="Toggle dark/light mode" title="Toggle dark/light mode (T)">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
  </button>
</div>
